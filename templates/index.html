<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <title>Losowanie grup</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        h1 {
            margin-bottom: 40px;
        }

        .losuj {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 22px 45px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }

        .losuj:hover {
            background-color: #0056b3;
        }

        .grupy {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .grupa {
            background-color: white;
            width: 250px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        ul {
            text-align: left;
        }

        li {
            margin: 8px;
        }

        .pobierz {
            margin-top: 30px;
            padding: 14px 25px;
            font-size: 17px;
            cursor: pointer;
        }

    </style>

</head>


<body>

    <h1>🎲 Losowanie Grup</h1>


    {% if grupy %}


        <div class="grupy">

            {% for grupa in grupy %}

                <div class="grupa">

                    <h2>Grupa {{ loop.index }}</h2>

                    <ul>

                        {% for osoba in grupa %}

                            <li>{{ osoba }}</li>

                        {% endfor %}

                    </ul>

                </div>

            {% endfor %}

        </div>


        <br><br>


        <a href="/losuj">

            <button class="losuj">
                🎲 Losuj ponownie
            </button>

        </a>


        <br>


        <a href="/pobierz">

            <button class="pobierz">
                📥 Pobierz do Excela
            </button>

        </a>


    {% else %}


        <a href="/losuj">

            <button class="losuj">
                🎲 Losuj Grupy
            </button>

        </a>


    {% endif %}


</body>

</html>
